<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Умный сад</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f4f7f1;--card:#ffffff;--ink:#1c2a1f;--muted:#66736a;--line:#e1e8dd;
  --accent:#2f8f4e;--accent-ink:#ffffff;--accent-soft:#e3f3e7;
  --warn:#8a5a0b;--warn-soft:#fdf1d6;
  --shadow:0 1px 2px rgba(20,40,25,.06),0 6px 20px rgba(20,40,25,.07);
}
:root[data-theme="dark"]{
  --bg:#121a14;--card:#1b261e;--ink:#eaf2ec;--muted:#93a498;--line:#2a3a2f;
  --accent:#4cc275;--accent-ink:#0c1a11;--accent-soft:#1f3a29;
  --warn:#e8c070;--warn-soft:#3a3220;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45}
#app{max-width:560px;margin:0 auto;padding:16px 16px calc(112px + env(safe-area-inset-bottom))}
h1{font-size:28px;line-height:1.15;margin:0 0 8px;letter-spacing:-.02em}
h2{font-size:22px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:17px;margin:20px 0 8px}
p{margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.muted{color:var(--muted)}
.small{font-size:13px}

.progress{display:flex;gap:6px;margin:2px 0 6px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--accent)}
.stepno{font-size:13px;color:var(--muted);margin-bottom:14px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:14px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 72%,transparent)}
.bar .btn{display:block;width:100%;max-width:528px;margin:0 auto}
.btn{border:0;border-radius:14px;padding:15px 18px;font-weight:600;font-size:16px;font-family:inherit;
  background:var(--accent);color:var(--accent-ink);cursor:pointer;text-align:center}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btns{display:grid;gap:10px;margin-top:20px}

.hero-intro{background:linear-gradient(135deg,#2f8f4e,#7bc47f);color:#fff;border-radius:22px;padding:26px 22px;margin-bottom:18px}
.hero-intro .big{font-size:54px;line-height:1;margin-bottom:10px}
.hero-intro h1{color:#fff}
.hero-intro p{color:rgba(255,255,255,.92);margin:0}
.flow{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.flow li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.flow .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-weight:700;display:grid;place-items:center;font-size:14px}
.flow b{display:block}
.flow span{color:var(--muted);font-size:14px}

.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;width:100%;padding:14px;border:2px solid transparent;border-radius:16px;
  background:var(--card);box-shadow:var(--shadow);cursor:pointer;text-align:left;color:inherit;font:inherit}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .ic{font-size:30px;flex:none;width:40px;text-align:center}
.opt b{display:block;font-size:17px}
.opt span{color:var(--muted);font-size:14px}

.search{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font:inherit;margin-bottom:10px}
.city{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:13px 14px;margin-bottom:8px;
  border:2px solid transparent;border-radius:14px;background:var(--card);color:inherit;font:inherit;cursor:pointer;text-align:left}
.city small{color:var(--muted)}
.city.sel{border-color:var(--accent);background:var(--accent-soft)}
.climates{display:grid;gap:8px;margin:0 0 10px 12px}
.info{background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.info b{font-size:16px}

.areabox{display:flex;gap:10px}
.areabox input,.areabox select{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:20px}
.areabox input{flex:1;min-width:0;font-weight:600}
.areabox select{font-size:16px}
.hint{margin:10px 2px 14px;color:var(--muted);font-size:14px;min-height:21px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;font-size:15px;cursor:pointer}

.work{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:12px}
.work li{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);opacity:.45;transition:opacity .3s}
.work li.act,.work li.done{opacity:1}
.work .dot{flex:none;width:22px;height:22px;border-radius:50%;border:3px solid var(--line)}
.work li.act .dot{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.work li.done .dot{border-color:var(--accent);background:var(--accent);animation:none;position:relative}
.work li.done .dot::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
@keyframes spin{to{transform:rotate(360deg)}}

.summary{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.tag{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--muted)}
.hero{display:block;width:100%;text-align:left;border:0;color:inherit;font:inherit;cursor:pointer;
  background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px;
  outline:2px solid var(--accent)}
.badge{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin-bottom:12px}
.row{display:flex;gap:14px;align-items:center}
.row .big{font-size:46px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:var(--bg);border-radius:12px;padding:9px 8px}
.stats b{display:block;font-size:15px;line-height:1.2}
.stats span{font-size:12px;color:var(--muted)}
.warnline{margin-top:10px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px}
.more{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;color:inherit;font:inherit;cursor:pointer;
  background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:10px}
.more .em{font-size:30px}
.more .grow{flex:1;min-width:0}
.more b{display:block}
.more span.s{color:var(--muted);font-size:13px;display:block}
.pct{font-weight:700;color:var(--accent)}

.back{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;padding:4px 0 12px;cursor:pointer}
.dhead{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.dhead .big{font-size:54px;line-height:1}
.why{background:var(--accent-soft);border-radius:16px;padding:12px 14px;margin:14px 0}
.why ul{margin:6px 0 0;padding-left:18px}
.why li{margin-bottom:3px}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:14px;margin:14px 0}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:9px 2px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.panel{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.panel ul.plain{margin:0;padding-left:18px}
.panel ul.plain li{margin-bottom:8px}
.eq{list-style:none;margin:0;padding:0}
.eq li{padding:10px 0;border-bottom:1px solid var(--line)}
.eq li:last-child{border:0}
.eq b{display:block}
.eq span{color:var(--muted);font-size:14px}
.st{list-style:none;margin:0;padding:0;counter-reset:s}
.st li{position:relative;padding:0 0 16px 40px}
.st li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);font-weight:700;display:grid;place-items:center;font-size:14px}
.st b{display:block;margin-bottom:2px}
.st span{color:var(--muted)}
.tip{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:6px}
table.t{width:100%;border-collapse:collapse}
table.t td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.t td:last-child{text-align:right;font-weight:600;padding-left:12px}
table.t tr:last-child td{border:0}
table.t tr.total td{font-size:17px;color:var(--accent)}
.foot{margin-top:16px;font-size:12px;color:var(--muted)}

/* ===== v2: категории, карточка, платный план ===== */
.c-greens{--g1:#2f8f4e;--g2:#8fd18a}
.c-veg{--g1:#d9622b;--g2:#f2b45a}
.c-decor{--g1:#b64a8f;--g2:#f0a3c8}
.c-trees{--g1:#2a7a74;--g2:#86c9a2}
.grad{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.ico{flex:none;vertical-align:middle}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.catrow{display:flex;gap:8px;overflow-x:auto;margin:6px -16px 14px;padding:2px 16px 6px;scrollbar-width:none}
.catrow::-webkit-scrollbar{display:none}
.catrow .chip{flex:none;white-space:nowrap}
.listhead{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 4px}
.listhead h3{margin:0}
.thumb{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px}

/* верхняя карточка результата */
.top{display:block;width:100%;text-align:left;border:0;font:inherit;cursor:pointer;border-radius:24px;padding:18px;margin-bottom:6px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.top .badge{background:rgba(255,255,255,.22);color:#fff;margin-bottom:14px}
.top .lockpill{position:absolute;right:14px;top:14px;display:flex;gap:5px;align-items:center;font-size:12px;font-weight:600;
  background:rgba(0,0,0,.2);border-radius:999px;padding:4px 10px}
.top .row .big{font-size:52px}
.top h2{color:#fff}
.top .muted{color:rgba(255,255,255,.88)}
.top .stats div{background:rgba(255,255,255,.2)}
.top .stats b{color:#fff}
.top .stats span{color:rgba(255,255,255,.85)}
.top .warnline{background:rgba(255,255,255,.92);color:#7a4a05}

/* карточка растения */
.dhero{position:relative;border-radius:24px;overflow:hidden;padding:20px 18px;margin-bottom:12px;min-height:150px;display:flex;
  gap:16px;align-items:center;box-shadow:var(--shadow)}
.dhero .dem{font-size:64px;line-height:1;flex:none}
.dhero .dphoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dhero .dbody{position:relative}
.dhero h2{color:#fff;font-size:26px;margin:2px 0 4px}
.dhero p{margin:0;color:rgba(255,255,255,.92);font-size:15px}
.dcat{display:inline-block;font-size:12px;font-weight:600;background:rgba(255,255,255,.22);border-radius:999px;padding:3px 10px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 8px}
.card ul{margin:0;padding-left:18px}
.card li{margin-bottom:5px}
.freebadge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
  background:var(--accent-soft);border-radius:6px;padding:2px 7px;margin-bottom:8px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums div{background:var(--bg);border-radius:12px;padding:10px 8px}
.nums b{display:block;font-size:16px;line-height:1.2}
.nums span{font-size:12px;color:var(--muted)}
.planhead{display:flex;justify-content:space-between;align-items:center;margin:24px 0 4px}
.planhead h2{margin:0;font-size:21px}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;border-radius:999px;padding:5px 11px;
  background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.grp{margin:18px 2px 8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lockrow,details.sec>summary{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;font:inherit;color:inherit;
  background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
.lockrow{margin-bottom:8px}
.lre{flex:none;width:38px;height:38px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:20px}
.lockrow .lre{filter:grayscale(.6);opacity:.8}
.lrt{flex:1;min-width:0}
.lrt b{display:block;font-size:15px;line-height:1.25}
.lrt i{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:2px}
.lockrow>.ico{color:var(--warn)}
details.sec{margin-bottom:8px}
details.sec>summary .ico{color:var(--muted);transition:transform .2s}
details.sec[open]>summary .ico{transform:rotate(180deg)}
details.sec[open]>summary{border-radius:16px 16px 0 0;box-shadow:none}
.secbody{background:var(--card);border-radius:0 0 16px 16px;padding:4px 16px 16px;box-shadow:var(--shadow)}
.secbody h4{margin:16px 0 6px;font-size:15px}
.secbody p{margin:8px 0}
.secbody ul.plain{margin:6px 0 0;padding-left:18px}
.secbody ul.plain li{margin-bottom:6px}
.promo{border-radius:20px;padding:18px;margin:18px 0 8px;background:linear-gradient(135deg,var(--accent-soft),var(--card));
  border:1px solid var(--line)}
.promo h3{margin:0 0 6px}
.promo p{margin:0 0 12px;color:var(--muted);font-size:14px}
.lnks{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.lnk{border:1px solid var(--line);background:var(--bg);color:var(--accent);font:inherit;font-size:14px;font-weight:600;border-radius:12px;padding:9px 12px;cursor:pointer}
.src{display:flex;gap:8px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.cal div{border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;line-height:1.25}
.cal b{display:block;font-size:13px}
.m-S{background:#fde7a8;color:#6b4a00}
.m-G{background:#d9ecd8;color:#24562c}
.m-H{background:#f6c3a8;color:#7a2d08}
.m-C{background:#cfe4f5;color:#174a73}
.m--{background:var(--bg);color:var(--muted)}
:root[data-theme="dark"] .m-S{background:#5a4812;color:#ffe9a8}
:root[data-theme="dark"] .m-G{background:#24402a;color:#bfe6c0}
:root[data-theme="dark"] .m-H{background:#5c2e1a;color:#ffd0b8}
:root[data-theme="dark"] .m-C{background:#1d3a52;color:#bfe0f7}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.legend span{border-radius:8px;padding:3px 8px}
.ch{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.ch.fit{border-color:var(--accent);background:var(--accent-soft)}
.ch .h{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.ch .h b{flex:1}
.ch .tg{font-size:11px;font-weight:700;color:var(--accent);background:var(--card);border-radius:999px;padding:2px 8px}
.ch p{margin:4px 0;font-size:14px}
.ch .k{color:var(--muted)}
.scen{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.scen>div{background:var(--bg);border-radius:12px;padding:10px 8px;font-size:12px}
.scen>div.base{outline:2px solid var(--accent)}
.scen h5{margin:0 0 6px;font-size:12px;color:var(--muted)}
.scen b{display:block;font-size:14px;line-height:1.2;margin-bottom:6px}
.tpl{background:var(--bg);border-radius:12px;padding:12px;font-size:14px;white-space:pre-wrap;margin:8px 0}
.svc{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.svc:last-child{border:0}
.svc .grow{flex:1;min-width:0}
.svc b{display:block;font-size:15px}
.svc span{font-size:13px;color:var(--muted)}
.btn.small{padding:9px 14px;font-size:14px;border-radius:12px}
.textlink{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:12px 0}

/* окно оплаты */
.shback{position:fixed;inset:0;background:rgba(10,20,12,.5);z-index:20;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--bg);
  border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .25s}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 4px}
.sheet .sub{margin:0 0 14px}
.inc{display:grid;gap:8px;margin-bottom:14px}
.inc div{display:flex;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;font-size:14px}
.inc b{display:block;font-size:14px}
.inc span{color:var(--muted);font-size:13px}
.plans{display:grid;gap:8px;margin-bottom:12px}
.plan{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;
  background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer}
.plan.sel{border-color:var(--accent);background:var(--accent-soft)}
.plan b{display:block}
.plan span.s{font-size:13px;color:var(--muted)}
.plan .pr{font-size:18px;font-weight:700;white-space:nowrap}
.plan .tg{display:inline-block;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 8px;margin-left:6px}
.sheet .note{font-size:12px;color:var(--muted);margin:10px 0 0;text-align:center}
.sheet .btn{width:100%}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#1c2a1f;color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;z-index:30;transition:all .25s;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

.reghead{margin:0 0 12px;font-size:22px}
</style>
</head>
<body>
<div id="app"></div>
<noscript>Для работы приложения нужен JavaScript.</noscript>
<script>
'use strict';

/* ================= Telegram ================= */
var tg = (window.Telegram && window.Telegram.WebApp) || null;

/* ================= Данные ================= */
// days — безморозный период (дней), winter — средняя температура января (°C), ориентировочно
var CITIES = [
  {id:'msk',name:'Москва',days:150,winter:-8},
  {id:'spb',name:'Санкт-Петербург',days:140,winter:-7},
  {id:'nn',name:'Нижний Новгород',days:145,winter:-10},
  {id:'kzn',name:'Казань',days:150,winter:-11},
  {id:'sam',name:'Самара',days:160,winter:-11},
  {id:'srt',name:'Саратов',days:170,winter:-9},
  {id:'vlg',name:'Волгоград',days:185,winter:-7},
  {id:'ast',name:'Астрахань',days:200,winter:-5},
  {id:'rnd',name:'Ростов-на-Дону',days:195,winter:-3},

    }else if(ratio<.85){
      hard=true;warns.push('В вашем климате сезон слишком короткий для этой культуры');
    }else if(ratio<1){
      warns.push('Сезон коротковат — берите раннеспелые сорта');
      reasons.push('Подходит при выборе раннеспелых сортов');
    }else{
      reasons.push(ratio>=1.2?'Безморозный период (~'+c.days+' дн.) подходит с запасом':'Сезон в вашем городе подходит');
    }
    if(p.spaceNotes&&p.spaceNotes[st.space])reasons.push(p.spaceNotes[st.space]);

    var useArea=Math.min(area,p.maxArea),capped=area>p.maxArea;
    if(area<p.minArea){
      hard=true;warns.push('Маловато места: комфортный минимум — '+fmtArea(p.minArea));
    }else if(capped){
      reasons.push('Из '+fmtArea(area)+' под эту культуру разумно занять до '+fmtArea(p.maxArea));
    }else{
      reasons.push('Площадь '+fmtArea(area)+' подходит для этой культуры');
    }

    var yieldMul=(st.space==='greenhouse'&&!p.indoor)?1.5:(st.space==='balcony'?.8:1);
    var yearKg=useArea*p.yield*yieldMul*cf;
    var revenue=yearKg*p.price;
    // на больших площадях нужен наёмный труд: добавляем расход, растущий с площадью
    var labor=useArea>300?Math.min(.25,.05+(useArea-300)/20000):0;
    var opex=revenue*(p.opex+extra+labor);
    var profit=revenue-opex;
    var capex=useArea*p.capex;
    var payback=profit>0?capex/profit*12+p.delay*12:Infinity;

    if(st.goal==='profit'){
      reasons.push(isFinite(payback)&&payback<=36?'Окупаемость '+fmtMonths(payback):'Подходит как дополнение к основным культурам');
    }else{
      reasons.push(p.diff===1?'Простая культура — удобна для старта':'Даёт свежий урожай для семьи');
    }

    var gf=st.goal==='profit'?p.profit:p.self;
    var afit=area<p.minArea?0:Math.min(1,p.maxArea/area);
    var s=45+gf*28+(3-p.diff)*2+afit*10+cf*6;
    if(st.goal==='profit'){
      s+=payback<=12?8:payback<=24?4:0;
      if(profit<=0)s-=20;
    }
    if(hard)s-=25;

    return {p:p,score:s,match:Math.max(30,Math.min(97,Math.round(s))),hard:hard,warns:warns,reasons:reasons,
      useArea:useArea,capped:capped,yearKg:yearKg,revenue:revenue,opex:opex,profit:profit,capex:capex,payback:payback};
  }
}
function compute(st){
  var area=toM2(st.areaVal,st.areaUnit),list=[];
  for(var i=0;i<PLANTS.length;i++){
    var p=PLANTS[i];
    if(p.spaces.indexOf(st.space)<0)continue;
    list.push(evalPlant(p,st,area));
  }
  list.sort(function(a,b){return b.score-a.score;});
  var good=list.filter(function(r){return !r.hard;});
  var bad=list.filter(function(r){return r.hard;});
  return good.length>=3?good:good.concat(bad);
}

      if(String(d.city).indexOf('custom-')===0&&byId(CLIMATES,d.city.slice(7))){state.city=customCity(d.city.slice(7));state.cityOther=true;}

    }

  return h+'</div><div class="stepno">Шаг '+n+' из 5</div>';
}
function bar(label){
  return '<div class="bar"><button class="btn" id="nextBtn" data-act="next"'+(canNext()?'':' disabled')+'>'+esc(label)+'</button></div>';
}
function canNext(){
  switch(state.screen){
    case 'city':return !!state.city;
    case 'space':return !!state.space;
    case 'area':var m=toM2(state.areaVal,state.areaUnit);return isFinite(m)&&m>=0.1&&m<=5000000;
    case 'goal':return !!state.goal;
  }
  return true;
}

var KEY_STOP={'республика':1,'область':1,'край':1,'автономный':1,'автономная':1,'округ':1,'город':1,'федерального':1,'значения':1,'югра':1,'алания':1,'чувашия':1};

function norm(s){return String(s||'').toLowerCase().replace(/ё/g,'е');}
function regKey(s){
  return norm(s).replace(/\([^)]*\)/g,' ').split(/[^а-я]+/).filter(function(t){return t&&!KEY_STOP[t];}).join(' ');
}
var REGIONS=REG_RAW.map(function(line,i){
  var p=line.split('|');
  var cities=(p[6]||'').split(',').filter(Boolean).map(function(c){
    var x=c.split(':');
    return {name:x[0],lat:parseFloat(x[1]),days:x[2]?parseInt(x[2],10):null,winter:x[3]?parseInt(x[3],10):null};
  });
  return {i:i,name:p[0],kind:p[1],days:+p[2],winter:+p[3],lat:+p[4],lon:+p[5],cities:cities,key:regKey(p[0])};
});

/* ---- климат ---- */
function regionClimate(reg,lat){
  var d=reg.days,w=reg.winter;
  if(lat!=null&&isFinite(lat)){
    var dl=reg.lat-lat; // > 0: населённый пункт южнее центра региона
    d=Math.max(reg.days*0.7,Math.min(reg.days*1.3,reg.days+dl*6));
    w=Math.max(reg.winter-8,Math.min(reg.winter+8,reg.winter+dl*0.8));
  }
  d=Math.max(60,Math.min(280,Math.round(d/5)*5));
  return {days:d,winter:Math.round(w)};
}
function embeddedCity(reg,name){
  for(var i=0;i<reg.cities.length;i++)if(reg.cities[i].name===name)return reg.cities[i];
  return null;
}
function climateFor(reg,name,lat){
  var e=embeddedCity(reg,name);
  if(e&&e.days!=null)return {days:e.days,winter:e.winter,exact:true};
  var la=(lat!=null&&isFinite(lat))?lat:(e?e.lat:null);
  var c=regionClimate(reg,la);c.exact=false;return c;
}
function regionFor(stateName,lat,lon){
  var k=regKey(stateName),i;
  if(k)for(i=0;i<REGIONS.length;i++)if(REGIONS[i].key===k)return {reg:REGIONS[i],exact:true};
  var best=REGIONS[0],bd=1e9,cl=Math.cos(lat*Math.PI/180);
  for(i=0;i<REGIONS.length;i++){
    var dy=REGIONS[i].lat-lat,dx=(REGIONS[i].lon-lon)*cl,d=dy*dy+dx*dx;
    if(d<bd){bd=d;best=REGIONS[i];}
  }
  return {reg:best,exact:false};
}

/* ---- живой поиск (Photon / OpenStreetMap) ---- */
var GEO={items:[],status:'idle',timer:null,ctl:null,cache:{}};
var PLACE_KIND={city:'город',town:'город / пгт',village:'село / посёлок',hamlet:'деревня / хутор'};

function parseGeo(d,reg){
  var out=[],seen={},f=(d&&d.features)||[];
  f.forEach(function(x){
    var pr=x.properties||{},g=x.geometry&&x.geometry.coordinates;
    if(pr.countrycode&&pr.countrycode!=='RU')return;
    if(pr.osm_key!=='place'||!PLACE_KIND[pr.osm_value]||!pr.name||!g)return;
    var r=regionFor(pr.state,g[1],g[0]);
    if(reg&&r.reg.i!==reg.i)return;
    var district=pr.county||pr.district||'';
    var k=pr.name+'|'+r.reg.i+'|'+district+'|'+Math.round(g[1]*20);
    if(seen[k])return;seen[k]=1;
    out.push({name:pr.name,kind:PLACE_KIND[pr.osm_value],lat:g[1],lon:g[0],district:district,reg:r.reg});
  });
  return out;
}
function runSearch(q){
  var reg=state.geoReg!=null?REGIONS[state.geoReg]:null;
  var key=norm(q)+'|'+(reg?reg.i:'');
  if(GEO.cache[key]){GEO.items=GEO.cache[key];GEO.status='done';fillCityList();return;}
  if(GEO.ctl){try{GEO.ctl.abort();}catch(e){}}
  var ctl=window.AbortController?new AbortController():null;
  GEO.ctl=ctl;
  var url=CONFIG.geoApi+'?q='+encodeURIComponent(q)+'&limit='+(reg?40:20)+'&countrycode=RU&osm_tag=place'+(reg?'&lat='+reg.lat+'&lon='+reg.lon:'');
  fetch(url,ctl?{signal:ctl.signal}:{})
    .then(function(r){if(!r.ok)throw new Error('http');return r.json();})
    .then(function(d){
      if(GEO.ctl!==ctl)return;
      GEO.items=parseGeo(d,reg);GEO.cache[key]=GEO.items;GEO.status='done';fillCityList();
    })
    .catch(function(e){
      if(GEO.ctl!==ctl||(e&&e.name==='AbortError'))return;
      GEO.items=[];GEO.status='error';fillCityList();
    });
}
function onCitySearch(v){
  state.q=v;
  clearTimeout(GEO.timer);
  var q=v.trim();
  if(q.length<3){
    if(GEO.ctl){try{GEO.ctl.abort();}catch(e){}}
    GEO.items=[];GEO.status='idle';fillCityList();return;
  }
  GEO.status='loading';GEO.items=[];fillCityList();
  GEO.timer=setTimeout(function(){runSearch(q);},450);
}

/* ---- выбор ---- */
function setCity(name,reg,lat){
  var c=climateFor(reg,name,lat);
  state.city={id:'geo:'+reg.i+':'+name,name:(name===reg.name?name:name+', '+reg.name),days:c.days,winter:c.winter,region:reg.name,approx:!c.exact};
  save();haptic();toast('Выбрано: '+state.city.name);
  fillCityInfo();fillCityList();updateNext();
}
function tmp(n){return (n>0?'+':'')+String(n).replace('-','−');}

function fillCityList(){
  var el=document.getElementById('geoBox');if(!el)return;
  var q=(state.q||'').trim(),ql=norm(q),reg=state.geoReg!=null?REGIONS[state.geoReg]:null,h='',live=q.length>=3;
  var cur=state.city?state.city.id:'';

  if(reg){
    h+='<button class="back" data-act="reg-back">← Все регионы</button><h2 class="reghead">'+esc(reg.name)+'</h2>';
    h+=cityBtn('Использовать климат всего региона','если не нашли свой населённый пункт','pick-reg',reg.i,cur==='geo:'+reg.i+':'+reg.name);
  }

  var shown={};
  if(reg){
    var cs=[];
    reg.cities.forEach(function(c,ci){if(!ql||norm(c.name).indexOf(ql)>=0)cs.push([c,ci]);});
    if(cs.length){
      h+='<div class="grp">'+(live||ql?'Города из списка':'Крупные города')+'</div>';
      cs.forEach(function(x){shown[norm(x[0].name)]=1;h+=cityBtn(x[0].name,'город','pick-place',reg.i+':'+x[1],cur==='geo:'+reg.i+':'+x[0].name);});
    }
  }
  if(live){
    h+='<div class="grp">Найденные населённые пункты</div>';
    if(GEO.status==='loading')h+='<p class="small muted">Ищем по всем населённым пунктам…</p>';
    else if(GEO.status==='error')h+='<p class="small muted">Поиск по всем населённым пунктам сейчас недоступен (нужен интернет). Выберите регион и город из списка или используйте климат региона.</p>';
    else{
      var n=0;
      GEO.items.forEach(function(it,idx){
        if(reg&&shown[norm(it.name)]&&it.reg.i===reg.i&&embeddedCity(reg,it.name))return;
        n++;
        h+=cityBtn(it.name,it.kind+(it.district?' · '+it.district:'')+(reg?'':' · '+it.reg.name),'pick-geo',idx,cur==='geo:'+it.reg.i+':'+it.name);
      });
      if(!n&&GEO.status==='done')h+='<p class="small muted">Ничего не найдено. Проверьте написание или выберите регион.</p>';
    }
  }

  if(!reg){
    var any=false;
    KIND_ORDER.forEach(function(k){
      var list=REGIONS.filter(function(r){return r.kind===k[0]&&(ql.length<2||r.key.indexOf(ql)>=0||norm(r.name).indexOf(ql)>=0);})
        .sort(function(a,b){return a.key<b.key?-1:(a.key>b.key?1:0);});
      if(!list.length)return;
      any=true;
      h+='<div class="grp">'+k[1]+' · '+list.length+'</div>';
      list.forEach(function(r){h+=cityBtn(r.name,'›','reg',r.i,state.city&&state.city.region===r.name);});
    });
    if(!any&&ql.length>=2&&!live)h+='<p class="small muted">Регион не найден. Введите ещё несколько букв — поищем населённый пункт.</p>';
  }else if(!ql){
    h+='<div class="src">🔎 <span>Начните вводить название — мы найдём любой город, пгт, село, посёлок или деревню в этом регионе.</span></div>';
  }
  el.innerHTML=h;
}

function geoAct(act,id){
  switch(act){
    case 'reg':state.geoReg=+id;state.q='';GEO.items=[];GEO.status='idle';haptic();render(true);return true;
    case 'reg-back':state.geoReg=null;state.q='';GEO.items=[];GEO.status='idle';render(true);return true;
    case 'pick-reg':var r=REGIONS[+id];setCity(r.name,r,null);return true;
    case 'pick-place':var p=String(id).split(':'),rg=REGIONS[+p[0]],c=rg.cities[+p[1]];setCity(c.name,rg,c.lat);return true;
    case 'pick-geo':var it=GEO.items[+id];if(it)setCity(it.name,it.reg,it.lat);return true;
  }
  return false;
}

function startAnalysis(){

  function alive(){return run===analysisRun&&state.screen==='analyze';}
  setTimeout(function(){if(alive())mark('a1','act');},50);
  setTimeout(function(){if(alive()){mark('a1','done');mark('a2','act');}},900);

    state.results=compute(state);

}

function copyText(txt){
  function fallback(){
    try{
      var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);
      toast(ok?'Текст скопирован':'Не удалось скопировать — выделите текст вручную');
    }catch(e){toast('Не удалось скопировать — выделите текст вручную');}
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('Текст скопирован');},fallback);}
    else fallback();
  }catch(e){fallback();}
}

function scaleRows(r){
  var p=r.p,base=r.useArea,areas=[base,Math.min(base*3,p.maxArea),Math.min(base*10,p.maxArea)],seen={},rows=[];

    var e=evalPlant(p,state,a);

  return rows;
}

  h+='<section class="card"><span class="freebadge">Бесплатно</span><h3>Что это за растение и для чего используется</h3><p>'+esc(p.about)+'</p><ul>'+
    p.use.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></section>';

  h+='<section class="card"><span class="freebadge">Бесплатно</span><h3>Почему это подходит вам</h3><ul>'+r.reasons.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>'+
    r.warns.map(function(w){return '<div class="warnline" style="margin-top:8px">⚠ '+esc(w)+'</div>';}).join('')+'</section>';

  h+='<section class="card"><span class="freebadge">Бесплатно</span><h3>Коротко в цифрах</h3><div class="nums">'+
    '<div><b>'+fmtMoney(r.capex*1.15)+'</b><span>на старт</span></div>'+
    '<div><b>'+fmtMoney(r.profit)+'</b><span>'+(state.goal==='profit'?'прибыль':'выгода')+' в год</span></div>'+
    '<div><b>'+(state.goal==='profit'?fmtMonths(r.payback):fmtQty(r.yearKg,p.unit))+'</b><span>'+(state.goal==='profit'?'окупаемость':'урожая в год')+'</span></div></div>'+
    '<p class="small muted" style="margin:10px 0 0">Для площади '+esc(fmtArea(r.useArea))+'. '+(open?'Подробный расчёт — в разделах ниже.':'Смета по статьям, себестоимость и сценарии — в полном плане.')+'</p></section>';

  h+='<div class="planhead"><h2>Полный план запуска</h2><span class="pill'+(open?' ok':'')+'">'+(open?'✓ Доступ открыт':ICO_LOCK.replace('width="18" height="18"','width="13" height="13"')+' 12 разделов')+'</span></div>'+
    '<p class="sub" style="margin-bottom:0">Пошаговая инструкция: от выбора семян до первых продаж.</p>';
  GROUPS.forEach(function(g){
    h+='<div class="grp">'+g.t+'</div>';
    g.ids.forEach(function(id){
      var s=byId(SECS,id);
      if(open){
        h+='<details class="sec"><summary><span class="lre">'+s.e+'</span><span class="lrt"><b>'+s.t+'</b></span>'+ICO_CHEV+'</summary><div class="secbody">'+secBody(id,r)+'</div></details>';
      }else{
        h+='<button class="lockrow" data-act="paywall" data-id="'+p.id+'"><span class="lre">'+s.e+'</span><span class="lrt"><b>'+s.t+'</b><i>'+esc(s.tz(p))+'</i></span>'+ICO_LOCK+'</button>';
      }
    });
  });

  if(open){
    h+='<section class="card" style="margin-top:20px"><h3>Нужна помощь с запуском?</h3>'+
      [['Расширенный бизнес-план','С расчётами под ваш проект'],['Консультация специалиста','Разбор вашей ситуации'],['Готовый комплект для выращивания','Всё необходимое для старта']].map(function(s){
        return '<div class="svc"><div class="grow"><b>'+s[0]+'</b><span>'+s[1]+'</span></div><button class="btn small ghost" data-act="service" data-id="'+esc(s[0])+'">'+(CONFIG.contactUrl?'Узнать':'Скоро')+'</button></div>';
      }).join('')+'</section>';
    if(CONFIG.demo)h+='<div style="text-align:center"><button class="textlink" data-act="demo-lock" data-id="'+p.id+'">Демо: снова закрыть доступ</button></div>';
  }else{
    h+='<div class="bar"><button class="btn" data-act="paywall" data-id="'+p.id+'">Открыть полный план · '+esc(CONFIG.priceOne)+'</button></div>';
  }
  return h+'<p class="foot">Расчёты ориентировочные: цены и урожайность зависят от региона, сорта и сбыта.</p>';
}

/* ---- окно оплаты ---- */
function sheetHtml(p){
  var plans=[['one','Этот план','Полный план «'+p.name+'»',CONFIG.priceOne,''],['all','Все планы','Все '+PLANTS.length+' культур, включая будущие',CONFIG.priceAll,'Выгоднее']];
  return '<div id="sheetRoot"><div class="shback" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="handle"></div>'+
    '<h2>Полный план запуска</h2><p class="sub">«'+esc(p.name)+'» — от выбора семян до первых продаж</p>'+
    '<div class="inc"><div><span>🌱</span><span><b>Вырастить</b><span>инструкция, календарь, частые ошибки</span></span></div>'+
    '<div><span>🛒</span><span><b>Запустить</b><span>где купить семена и оборудование, сборка, смета, себестоимость</span></span></div>'+
    '<div><span>💰</span><span><b>Заработать</b><span>прибыль, куда и кому продать, поиск покупателей, масштаб</span></span></div></div>'+
    '<div class="plans" id="plans">'+plans.map(function(x){
      return '<button class="plan'+(x[0]==='all'?' sel':'')+'" data-act="sheet-opt" data-id="'+x[0]+'"><span><b>'+x[1]+(x[4]?'<span class="tg">'+x[4]+'</span>':'')+'</b><span class="s">'+esc(x[2])+'</span></span><span class="pr">'+esc(x[3])+'</span></button>';
    }).join('')+'</div>'+
    '<button class="btn" id="buyBtn" data-act="buy">Открыть за '+esc(CONFIG.priceAll)+'</button>'+
    '<button class="textlink" style="width:100%" data-act="close-sheet">Не сейчас</button>'+
    (CONFIG.demo?'<p class="note">Демо-режим: оплата не подключена, доступ откроется без списания денег.</p>':'')+'</div></div>';
}
function openSheet(id){
  var p=byId(PLANTS,id);if(!p||document.getElementById('sheetRoot'))return;
  state.sheet=id;state.sheetPlan='all';
  document.getElementById('app').insertAdjacentHTML('beforeend',sheetHtml(p));
  document.body.style.overflow='hidden';
  haptic();
}
function closeSheet(){
  var s=document.getElementById('sheetRoot');
  if(s&&s.parentNode)s.parentNode.removeChild(s);
  state.sheet=null;document.body.style.overflow='';
}
function grant(plan,plantId){
  if(plan==='all')access.all=true;
  else if(access.ids.indexOf(plantId)<0)access.ids.push(plantId);
  saveAccess();closeSheet();render(false);toast('Доступ открыт');
}
function buy(plan,plantId){
  if(CONFIG.invoiceEndpoint){
    try{
      fetch(CONFIG.invoiceEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({plan:plan,plant:plantId,initData:(tg&&tg.initData)||''})})
        .then(function(r){return r.json();})
        .then(function(d){
          if(tg&&tg.openInvoice&&d&&d.link){tg.openInvoice(d.link,function(status){if(status==='paid')grant(plan,plantId);});}
          else toast('Не удалось открыть оплату');
        })
        .catch(function(){toast('Не удалось открыть оплату');});
    }catch(e){toast('Не удалось открыть оплату');}
  }else if(CONFIG.demo){
    grant(plan,plantId);
  }else{
    toast('Оплата пока не подключена');
  }
}
function extraAct(act,id,el){
  if(geoAct(act,id))return;
  switch(act){
    case 'cat':state.cat=id;state.showAll=false;render(false);break;
    case 'showall':state.showAll=true;render(false);break;
    case 'paywall':haptic();openSheet(id||state.detailId);break;
    case 'close-sheet':closeSheet();break;
    case 'sheet-opt':
      state.sheetPlan=id;
      var opts=document.querySelectorAll('#plans .plan');
      for(var i=0;i<opts.length;i++)opts[i].classList.toggle('sel',opts[i].getAttribute('data-id')===id);
      var b=document.getElementById('buyBtn');
      if(b)b.textContent='Открыть за '+(id==='all'?CONFIG.priceAll:CONFIG.priceOne);
      haptic();break;
    case 'buy':buy(state.sheetPlan,state.sheet);break;
    case 'demo-lock':
      access.all=false;access.ids=[];saveAccess();render(false);toast('Доступ закрыт (демо)');break;
    case 'link':openUrl(el.getAttribute('data-url'));break;
    case 'copy':copyText(el.getAttribute('data-text')||'');break;
    case 'service':
      if(CONFIG.contactUrl)openUrl(CONFIG.contactUrl);else toast('Скоро будет доступно');break;
  }
}

/* ================= Рендер ================= */
function render(toTop){
  var app=document.getElementById('app');
  if(state.sheet){state.sheet=null;document.body.style.overflow='';}
  var h;
  if(state.detailId)h=viewDetail();
  else switch(state.screen){
    case 'intro':h=viewIntro();break;
    case 'city':h=viewCity();break;
    case 'space':h=viewSpace();break;
    case 'area':h=viewArea();break;
    case 'goal':h=viewGoal();break;
    case 'analyze':h=viewAnalyze();break;
    default:h=viewResult();
  }
  app.innerHTML=h;
  if(!state.detailId){
    if(state.screen==='city'){fillCityList();fillCityInfo();}
    if(state.screen==='area')fillAreaHint();
  }
  updateBack();
  if(toTop)window.scrollTo(0,0);
}

/* ================= Навигация ================= */
function go(screen){state.screen=screen;render(true);}
function back(){
  if(state.sheet){closeSheet();return;}
  if(state.detailId){closeDetail();return;}
  if(state.screen==='city'&&state.geoReg!=null){state.geoReg=null;state.q='';GEO.items=[];GEO.status='idle';render(true);return;}
  var i=ORDER.indexOf(state.screen);
  if(state.screen==='result'||state.screen==='analyze'){analysisRun++;state.screen='goal';}
  else if(i>0)state.screen=ORDER[i-1];
  render(true);
}
function closeDetail(){
  state.detailId=null;
  render(false);
  window.scrollTo(0,state.scrollY||0);
}
function next(){
  if(!canNext())return;
  switch(state.screen){
    case 'city':go('space');break;
    case 'space':go('area');break;
    case 'area':go('goal');break;
    case 'goal':startAnalysis();break;
  }
}

/* ================= События ================= */
function init(){
  var app=document.getElementById('app');
  app.addEventListener('click',function(e){
    var el=e.target.closest?e.target.closest('[data-act]'):null;
    if(!el)return;
    var act=el.getAttribute('data-act'),id=el.getAttribute('data-id');
    switch(act){
      case 'start':haptic();go('city');break;
      case 'next':haptic();next();break;
      case 'pick-space':state.space=id;save();haptic();render(false);break;
      case 'pick-goal':state.goal=id;save();haptic();render(false);break;
      case 'chip':
        var v=parseFloat(el.getAttribute('data-m2'));
        if(state.space==='plot'&&v>=10000){state.areaUnit='га';state.areaVal=dec(v/10000);}
        else if(state.space==='plot'){state.areaUnit='сотки';state.areaVal=dec(v/100);}
        else{state.areaUnit='м²';state.areaVal=String(v);}
        save();haptic();
        var inp=document.getElementById('areaInput'),sel=document.getElementById('areaUnit');
        if(inp)inp.value=state.areaVal;
        if(sel)sel.value=state.areaUnit;
        fillAreaHint();updateNext();break;
      case 'open':
        state.scrollY=window.scrollY||0;state.detailId=id;state.tab='use';haptic();render(true);break;
      case 'close-detail':closeDetail();break;
      default:extraAct(act,id,el);break;
      case 'tab':state.tab=id;haptic();render(false);break;
      case 'edit':analysisRun++;go('city');break;
      case 'restart':
        analysisRun++;state.city=null;state.cityOther=false;state.q='';state.space=null;state.areaVal='';state.areaUnit='м²';state.goal=null;
        state.results=null;state.detailId=null;save();go('intro');break;
    }
  });
  app.addEventListener('input',function(e){
    var t=e.target;
    if(t.id==='citySearch'){onCitySearch(t.value);}
    else if(t.id==='areaInput'){state.areaVal=t.value;save();fillAreaHint();updateNext();}
  });
  app.addEventListener('change',function(e){
    if(e.target.id==='areaUnit'){state.areaUnit=e.target.value;save();fillAreaHint();updateNext();}
  });

  try{
    if(tg){
      tg.ready();
      if(tg.expand)tg.expand();
      if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();
      if(tg.onEvent)tg.onEvent('themeChanged',applyTheme);
      if(tg.BackButton)tg.BackButton.onClick(back);
    }
  }catch(err){}
  applyTheme();
  load();
  loadAccess();
  render(true);
}
init();
</script>
</body>
</html>
